<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 260" width="740" height="260" role="img" aria-label="GymFit Center" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>GymFit Center</title>
  <!-- Icono: bloque negro con mancuerna -->
  <rect x="30" y="30" width="200" height="200" rx="28" fill="#111111"/>
  <g transform="translate(130 130) rotate(-30) scale(0.5)">
    <rect x="-150" y="-9" width="300" height="18" fill="#FFFFFF"/>
    <rect x="-166" y="-14" width="20" height="28" rx="4" fill="#FFFFFF"/>
    <rect x="146" y="-14" width="20" height="28" rx="4" fill="#FFFFFF"/>
    <rect x="-140" y="-62" width="32" height="124" rx="9" fill="#df2c30"/>
    <rect x="-104" y="-44" width="22" height="88" rx="6" fill="#FFFFFF"/>
    <rect x="82" y="-44" width="22" height="88" rx="6" fill="#FFFFFF"/>
    <rect x="108" y="-62" width="32" height="124" rx="9" fill="#df2c30"/>
  </g>
  <!-- Texto: GYMFIT y CENTER centrados entre sí -->
  <g transform="translate(266 142) skewX(-10)" font-family="Impact, 'Arial Black', Haettenschweiler, sans-serif">
    <text x="0" y="0" font-size="108" fill="#111111" textLength="420" lengthAdjust="spacingAndGlyphs">GYM<tspan fill="#df2c30">FIT</tspan></text>
    <rect x="42" y="44" width="54" height="5" fill="#df2c30"/>
    <rect x="324" y="44" width="54" height="5" fill="#df2c30"/>
    <text x="110" y="62" font-size="42" fill="#111111" textLength="200" lengthAdjust="spacing">CENTER</text>
  </g>
</svg>
